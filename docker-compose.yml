# ── SmartHire · docker-compose.yml ──
version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:16-alpine
    container_name: smarthire_postgres
    environment:
      POSTGRES_DB:       smarthire
      POSTGRES_USER:     ${DB_USER:?DB_USER required}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d smarthire"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smarthire_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthire_api
    environment:
      DB_URL:           jdbc:postgresql://postgres:5432/smarthire
      DB_USER:          ${DB_USER}
      DB_PASS:          ${DB_PASS}
      REDIS_HOST:       redis
      REDIS_PASSWORD:   ${REDIS_PASSWORD}
      JWT_SECRET:       ${JWT_SECRET:?JWT_SECRET required}
      CLAUDE_API_KEY:   ${CLAUDE_API_KEY:}
      MAIL_HOST:        ${MAIL_HOST:smtp.gmail.com}
      MAIL_USERNAME:    ${MAIL_USERNAME:}
      MAIL_PASSWORD:    ${MAIL_PASSWORD:}
      FRONTEND_URL:     ${FRONTEND_URL:http://localhost}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:default}
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarthire_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    logging: *default-logging
    restart: unless-stopped


  minio:
    image: minio/minio:latest
    container_name: smarthire_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: smarthire_prometheus
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: smarthire_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  minio_data:

networks:
  default:
    name: smarthire_network
