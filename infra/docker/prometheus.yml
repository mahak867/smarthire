# ── SmartHire · infra/docker/prometheus.yml ──
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    app: smarthire

scrape_configs:
  - job_name: smarthire-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: smarthire-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
