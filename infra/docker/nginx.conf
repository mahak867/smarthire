# ── SmartHire · infra/docker/nginx.conf ──

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent",'
        '"x_request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;   # hide nginx version

    # Gzip
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_general:20m   rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=api_auth:10m      rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=api_upload:5m     rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upload size limit ─────────────────────────────────────────────────────
    client_max_body_size 6m;    # 1m above app-level 5m limit (catches before Java)
    client_body_timeout  30s;

    # ── Security headers (applied globally) ──────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "DENY"                           always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # CSP — tightened: only self + inline styles for React
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';"
        always;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream smarthire_api {
        server api:8080;
        keepalive 32;
    }

    # ── Server ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        limit_conn conn_limit 20;  # max 20 simultaneous connections per IP

        # ── SPA fallback ─────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively; index.html is never cached
            location ~* \.(js|css|png|jpg|ico|svg|woff2?|ttf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── API proxy ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass         http://smarthire_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection       "";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID     $request_id;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── Auth endpoints — stricter rate limit ─────────────────────────────
        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=api_auth burst=3 nodelay;

            proxy_pass         http://smarthire_api;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-ID     $request_id;
        }

        # ── File upload — dedicated limit ────────────────────────────────────
        location /api/v1/files/upload {
            limit_req zone=api_upload burst=5 nodelay;
            client_max_body_size 6m;

            proxy_pass         http://smarthire_api;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;  # PDF upload can take longer
        }

        # ── Swagger UI — only in non-prod ────────────────────────────────────
        location /docs {
            proxy_pass http://smarthire_api/docs;
            proxy_set_header Host $host;
        }

        # ── Health check — no rate limit, no auth logging ────────────────────
        location /api/v1/health {
            proxy_pass http://smarthire_api;
            access_log off;
        }

        # ── Block common attack paths ─────────────────────────────────────────
        location ~* \.(php|asp|aspx|jsp|cgi|env|git|htaccess|htpasswd)$ {
            return 444;
        }
        location ~ /\. {
            deny all;
        }
    }
}
