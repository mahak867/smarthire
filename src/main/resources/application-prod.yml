# ── SmartHire · src/main/resources/application-prod.yml ──
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      ssl:
        enabled: true

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.smarthire: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","logger":"%logger{36}","message":"%msg","requestId":"%X{requestId}"}%n'

smarthire:
  security:
    hsts-enabled: true
