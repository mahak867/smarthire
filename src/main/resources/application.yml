# ── SmartHire · src/main/resources/application.yml ──
spring:
  application:
    name: smarthire

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smarthire}
    username: ${DB_USER:smarthire}
    password: ${DB_PASS}
    hikari:
      pool-name: SmartHirePool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        generate_statistics: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null


  lifecycle:
    timeout-per-shutdown-phase: 30s   # graceful shutdown window

  websocket:
    message-size-limit: 65536         # 64KB max message size
    send-buffer-size-limit: 524288    # 512KB send buffer
    send-time-limit: 10000            # 10s to send before disconnect

  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: SmartHire-Scheduler-

  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    thread-name-prefix: SmartHire-Async-

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

smarthire:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-days: 7
  claude:
    api-key: ${CLAUDE_API_KEY:}
    api-url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514
    timeout-seconds: 5
    enabled: ${CLAUDE_ENABLED:true}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: noreply@smarthire.app
    from-name: SmartHire

  minio:
    endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:smarthire}
    secret-key: ${MINIO_SECRET_KEY}
    bucket:     ${MINIO_BUCKET:smarthire-resumes}

  security:
    max-login-attempts: 5          # lock after N consecutive failures
    lockout-minutes: 15            # initial lockout duration (doubles on repeat offences)
    hsts-enabled: false            # set true in production behind HTTPS
    password-history-count: 5      # prevent reuse of last N passwords
    session-absolute-timeout: 8h   # force re-auth after 8 hours regardless of activity

  rate-limit:
    login-max: 5
    login-window-minutes: 15
    register-max: 3
    register-window-hours: 1
    global-max: 100
    global-window-minutes: 1
